<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TX Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly home game, quick and readable like PokerNow
   IDEA: a card-room table at night with a coach whispering one line
   PICTURE: the felt table, big colour-coded cards, glowing active seat
   COLOUR/TYPE: charcoal room, emerald felt, gold chips; Nunito throughout
   LAYOUT: table on top, one-line coach + big action buttons docked below */
:root{color-scheme:dark;--bg:#12151b;--panel:#1c212b;--panel2:#252c38;--ink:#eef2f7;--mute:#97a3b4;--line:#2e3644;--gold:#ffc548;--green:#2fbf71;--red:#ef4b5b;--blue:#3d8bfd;--s0:#2b2f38;--s1:#e0364a;--s2:#2f72e6;--s3:#1f9d55}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#1d2430,var(--bg));color:var(--ink);font:15px/1.45 Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:clip}
button,select,input{font:inherit}
header{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px max(2vw,12px);max-width:1180px;margin:0 auto}
.logo{font-weight:900;font-size:22px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:50%;background:var(--gold);border:4px dashed #fff9;display:inline-block}
.chipstat{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chipstat span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--mute);white-space:nowrap}
.chipstat b{color:var(--ink);font-weight:800}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;min-height:36px;display:flex;align-items:center}
.menu summary::-webkit-details-marker{display:none}
.menu[open] .pop{display:grid}
.pop{display:none;position:absolute;right:0;top:44px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;gap:10px;width:250px;box-shadow:0 16px 40px #0009}
.pop label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.pop select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;min-height:34px;padding:0 6px}
.pop input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:0 max(2vw,12px) 28px}
.table{position:relative;height:clamp(440px,58vw,600px)}
.felt{position:absolute;inset:12% 8% 14%;border-radius:999px;background:radial-gradient(ellipse at 50% 42%,#2f8f5b,#1c6440 55%,#124a30);border:16px solid #2a2f38;box-shadow:inset 0 0 0 3px #3b4250,inset 0 12px 50px #0008,0 24px 60px #000a}
.felt::after{content:"TX POKER";position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(16px,2.4vw,26px);letter-spacing:6px;color:#ffffff14}
.seat{position:absolute;transform:translate(-50%,-50%);width:150px;z-index:2}
.plate{display:flex;align-items:center;gap:8px;background:#161b23f0;border:2px solid #313a48;border-radius:16px;padding:7px 10px 7px 7px;position:relative}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;background:var(--c,#555);box-shadow:inset 0 -3px 0 #0003}
.who{flex:1;line-height:1.15}
.nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk{font-weight:900;font-size:17px;color:var(--gold)}
.tag{position:absolute;top:-11px;right:8px;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:#313a48;color:#dfe6ef;white-space:nowrap}
.act{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font-size:12px;font-weight:800;padding:1px 10px;border-radius:999px;white-space:nowrap;background:#313a48;color:#fff}
.act.fold{background:#4a2a31;color:#ffb3bc}.act.raise{background:#7a5a10;color:#ffe2a0}.act.call{background:#1d4d35;color:#b6f0d0}
.seat.turn .plate{border-color:var(--gold);box-shadow:0 0 0 4px #ffc54840,0 0 24px #ffc54855}
.seat.out{opacity:.4}
.seat.win .plate{border-color:var(--green);box-shadow:0 0 0 4px #2fbf7140,0 0 30px #2fbf7177}
.gain{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-weight:900;font-size:22px;color:var(--green);text-shadow:0 2px 6px #000;white-space:nowrap}
.hand{display:flex;justify-content:center;gap:4px;margin-bottom:-10px;position:relative;z-index:-1}
.btn-d{position:absolute;left:-12px;top:-12px;width:26px;height:26px;border-radius:50%;background:#fff;color:#111;font:900 13px/26px Nunito;text-align:center;box-shadow:0 2px 6px #0009}
.cd{width:46px;height:64px;border-radius:7px;background:var(--c);color:#fff;position:relative;box-shadow:0 3px 8px #0008;font-weight:900;overflow:hidden}
.cd b{position:absolute;left:5px;top:1px;font-size:24px;line-height:1.1}
.cd i{position:absolute;left:6px;top:27px;font-style:normal;font-size:20px;line-height:1}
.cd.back{background:repeating-linear-gradient(45deg,#3d4a63 0 6px,#33405a 6px 12px);border:3px solid #e9edf3}
.cd.hi{outline:3px solid var(--gold);outline-offset:1px}
.classic .cd:not(.back){background:#fff;color:var(--k)}
.board{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;gap:7px;z-index:1}
.board .cd{width:60px;height:84px}.board .cd b{font-size:32px}.board .cd i{font-size:30px;top:38px;left:8px}
.slot{width:60px;height:84px;border-radius:7px;border:2px dashed #ffffff1c}
.pot{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);background:#0009;border-radius:999px;padding:4px 16px;font-weight:900;font-size:18px;white-space:nowrap;z-index:1}
.pot small{color:var(--mute);font-weight:700;font-size:13px;margin-left:6px}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px;background:#0008;padding:2px 10px 2px 4px;border-radius:999px;z-index:1;white-space:nowrap}
.bet::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px dashed #fffa}
.banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);background:var(--gold);color:#241800;font-weight:900;padding:7px 16px;border-radius:12px;z-index:3;max-width:70%;text-align:center;box-shadow:0 8px 24px #0008}
.s0{left:50%;top:89%}.s1{left:10%;top:70%}.s2{left:12%;top:22%}.s3{left:50%;top:9%}.s4{left:88%;top:22%}.s5{left:90%;top:70%}
.b0{left:50%;top:68%}.b1{left:25%;top:63%}.b2{left:26%;top:33%}.b3{left:50%;top:21%}.b4{left:74%;top:33%}.b5{left:75%;top:63%}
.dock{display:grid;gap:10px;margin-top:6px}
.coach{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--p)*1%),#2e3644 0);display:grid;place-items:center}
.ring div{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-size:20px;font-weight:900}.ring small{display:block;font-size:10px;color:var(--mute);font-weight:800;margin-top:2px}
.say{font-size:16px;font-weight:800}
.sub{font-size:13px;color:var(--mute)}
.sub b{color:var(--ink)}
.verdict{font-weight:900;font-size:15px;padding:8px 14px;border-radius:12px;text-align:center;white-space:nowrap}
.v-good{background:#1d4d35;color:#9ff0c4}.v-bad{background:#4a2a31;color:#ffb3bc}.v-mid{background:#4d3d14;color:#ffdc8a}
.more{grid-column:1/-1;font-size:13px}
.more summary{cursor:pointer;color:var(--mute);font-weight:800;min-height:28px;display:flex;align-items:center}
.more .grid{display:grid;gap:8px;margin-top:6px}
.cat{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cat b{margin-right:4px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-weight:800;font-size:12px}
.lc{display:inline-block;font-weight:900;font-size:13px;padding:0 5px;border-radius:5px;background:var(--c);color:#fff;margin:0 1px}
.classic .lc{background:#fff;color:var(--k)}
.actions{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px}
.btnrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big{min-height:58px;border-radius:14px;border:0;font-weight:900;font-size:18px;color:#fff;cursor:pointer;transition:transform .08s,box-shadow .2s}
.big:active{transform:scale(.97)}
.big small{display:block;font-size:11px;font-weight:800;opacity:.75}
.b-fold{background:#c43a4b}.b-call{background:#1f9d58}.b-raise{background:#2f72e6}.b-next{background:var(--gold);color:#241800;grid-column:1/-1}
.big:disabled{opacity:.3;cursor:not-allowed}
.big.rec{box-shadow:0 0 0 3px #fff,0 0 22px #fff8}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rpanel{display:none;gap:8px;align-items:center;flex-wrap:wrap}
.rpanel.on{display:flex}
.rpanel button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:800;cursor:pointer}
.rpanel input[type=range]{flex:1 1 200px;accent-color:var(--blue);min-height:40px}
.rpanel input[type=number]{width:90px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font-weight:900;font-size:17px}
.rpanel .go{background:var(--blue);border-color:var(--blue);color:#fff}
.wait{color:var(--mute);font-weight:800;text-align:center;padding:6px}
.log{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.log summary{cursor:pointer;font-weight:800;min-height:32px;display:flex;align-items:center}
.log .lines{max-height:240px;overflow:auto;font-size:13px;display:grid;gap:2px;margin-top:4px}
.log .st{font-weight:900;color:var(--mute);margin-top:6px}.log .w{font-weight:900;color:var(--green)}
kbd{font:800 10px Nunito;border:1px solid #fff5;border-radius:4px;padding:0 4px;margin-left:4px;opacity:.7}
.c0{--c:var(--s0);--k:#1b1b1b}.c1{--c:var(--s1);--k:#d0263a}.c2{--c:var(--s2);--k:#d0263a}.c3{--c:var(--s3);--k:#1b1b1b}
@media(prefers-reduced-motion:no-preference){
 .deal{animation:deal .35s ease-out backwards}@keyframes deal{from{transform:translateY(-30px) scale(.6);opacity:0}}
 .seat.turn .plate{animation:glow 1.3s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 7px #ffc54822,0 0 30px #ffc54866}}
 .gain{animation:up 1.6s ease-out forwards}@keyframes up{from{transform:translate(-50%,10px);opacity:0}20%{opacity:1}to{transform:translate(-50%,-14px)}}
 .bet{animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,-50%) scale(.4)}}}
@media(max-width:640px){
 .table{height:520px}.felt{inset:15% 3% 15%;border-width:10px}
 .seat{width:104px}.plate{padding:5px 6px 5px 5px;gap:5px;border-radius:12px}.av{width:28px;height:28px;font-size:13px}.nm{font-size:12px}.stk{font-size:14px}
 .cd{width:34px;height:48px}.cd b{font-size:18px;left:4px}.cd i{font-size:15px;top:20px;left:5px}
 .board{gap:4px}.board .cd,.slot{width:44px;height:62px}.board .cd b{font-size:22px}.board .cd i{font-size:20px;top:27px;left:6px}
 .s1{left:14%;top:67%}.s5{left:86%;top:67%}.s2{left:15%;top:26%}.s4{left:85%;top:26%}.s3{top:10%}
 .b1{left:30%;top:58%}.b5{left:70%;top:58%}.b2{left:31%;top:37%}.b4{left:69%;top:37%}.b3{top:22%}
 .banner{font-size:13px;max-width:70%;top:30%}
 .chipstat span:nth-child(n+3){display:none}.chipstat{margin-left:0;order:3;width:100%}.menu{margin-left:auto}
 .coach{grid-template-columns:auto minmax(0,1fr)}.verdict{grid-column:1/-1}
 .big{min-height:54px;font-size:16px}kbd{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>TX Poker</div>
  <div class="chipstat" id="stats"></div>
  <details class="menu"><summary>Settings</summary>
    <div class="pop">
      <label>Bots <select id="oLvl"><option value="casual">Casual (beatable)</option><option value="strong">Strong (sharks)</option></select></label>
      <label>Bot speed <select id="oSpd"><option value="350">Fast</option><option value="800">Normal</option><option value="1400">Slow</option></select></label>
      <label>Show best-move hint <input type="checkbox" id="oHint"></label>
      <label>Auto-deal next hand <input type="checkbox" id="oAuto"></label>
      <label>Study mode (see bot cards) <input type="checkbox" id="oPeek"></label>
      <label>Colour cards by suit <input type="checkbox" id="o4c"></label>
    </div>
  </details>
</header>
<main>
  <div class="table">
    <div class="felt"></div>
    <div class="pot" id="pot">Shuffling…</div>
    <div class="board" id="board"></div>
    <div id="seats"></div>
    <div id="bets"></div>
    <div id="banner"></div>
  </div>
  <div class="dock">
    <section class="coach" id="coach"><div class="sub">Getting the table ready…</div></section>
    <section class="actions">
      <div class="rpanel" id="rp">
        <span id="pre" style="display:flex;gap:6px;flex-wrap:wrap"></span>
        <input type="range" id="rSl" aria-label="Raise amount">
        <input type="number" id="rIn" aria-label="Raise to">
        <button class="go" id="rGo">Confirm</button>
      </div>
      <div class="btnrow" id="btns">
        <button class="big b-fold" id="bFold">Fold<kbd>F</kbd></button>
        <button class="big b-call" id="bCall">Check<kbd>C</kbd></button>
        <button class="big b-raise" id="bRaise">Raise<kbd>R</kbd></button>
        <button class="big b-next" id="bNext" hidden>Deal next hand<kbd>N</kbd></button>
      </div>
    </section>
  </div>
  <details class="log"><summary>Hand history</summary><div class="lines" id="log"></div></details>
</main>
<script>
{
const $=s=>document.querySelector(s);
const RANKS='23456789TJQKA',SYM=['♠','♥','♦','♣'];
const RN=['Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Jack','Queen','King','Ace'];
const pl=r=>r===4?'Sixes':RN[r]+'s';
const CAT=['High card','Pair','Two pair','Three of a kind','Straight','Flush','Full house','Four of a kind','Straight flush'];
const CATS=['high cards','pairs','two pairs','sets/trips','straights','flushes','full houses','quads','straight flushes'];
const rk=c=>c>>2,st=c=>c&3,BB=2,SB=1,START=200;
const pc=x=>Math.round(x*100)+'%';
const rl=r=>r===8?'10':RANKS[r];
/* ---------- hand evaluator (5-7 cards) ---------- */
const RC=new Int8Array(13),SM=[0,0,0,0],SC=[0,0,0,0];
function sHigh(m){for(let h=12;h>=4;h--){const x=0x1F<<(h-4);if((m&x)===x)return h}return (m&0x100F)===0x100F?3:-1}
function kick(ex,n){let v=0,c=0;for(let r=12;r>=0&&c<n;r--)if(RC[r]&&!(ex>>r&1)){v=v<<4|r;c++}while(c<n){v<<=4;c++}return v}
function ev(cs){
  RC.fill(0);SM[0]=SM[1]=SM[2]=SM[3]=0;SC[0]=SC[1]=SC[2]=SC[3]=0;let all=0;
  for(let k=0;k<cs.length;k++){const c=cs[k],r=c>>2,s=c&3;RC[r]++;SM[s]|=1<<r;SC[s]++;all|=1<<r}
  let fs=-1;for(let s=0;s<4;s++)if(SC[s]>=5)fs=s;
  if(fs>=0){const h=sHigh(SM[fs]);if(h>=0)return 8<<20|h<<16}
  let q=-1,t1=-1,t2=-1,p1=-1,p2=-1;
  for(let r=12;r>=0;r--){const n=RC[r];if(n===4)q=r;else if(n===3){if(t1<0)t1=r;else if(t2<0)t2=r}else if(n===2){if(p1<0)p1=r;else if(p2<0)p2=r}}
  if(q>=0)return 7<<20|q<<16|kick(1<<q,1)<<12;
  if(t1>=0&&(t2>=0||p1>=0))return 6<<20|t1<<16|Math.max(t2,p1)<<12;
  if(fs>=0){let m=SM[fs],v=0,c=0;for(let r=12;r>=0&&c<5;r--)if(m>>r&1){v=v<<4|r;c++}return 5<<20|v}
  const h=sHigh(all);if(h>=0)return 4<<20|h<<16;
  if(t1>=0)return 3<<20|t1<<16|kick(1<<t1,2)<<8;
  if(p1>=0&&p2>=0)return 2<<20|p1<<16|p2<<12|kick(1<<p1|1<<p2,1)<<8;
  if(p1>=0)return 1<<20|p1<<16|kick(1<<p1,3)<<4;
  return kick(0,5);
}
function hname(s){const c=s>>20,a=s>>16&15,b=s>>12&15;
  return [`${RN[a]}-high`,`Pair of ${pl(a)}`,`Two pair, ${pl(a)} & ${pl(b)}`,`Three ${pl(a)}`,`Straight, ${RN[a]}-high`,`Flush, ${RN[a]}-high`,`Full house, ${pl(a)} full of ${pl(b)}`,`Four ${pl(a)}`,a===12?'Royal flush':`Straight flush, ${RN[a]}-high`][c]}

/* ---------- preflop classes & strength percentile ---------- */
function cls(a,b){const x=rk(a),y=rk(b),hi=Math.max(x,y),lo=Math.min(x,y);if(hi===lo)return hi*13+hi;return st(a)===st(b)?hi*13+lo:lo*13+hi}
function clsName(i){const x=Math.floor(i/13),y=i%13;if(x===y)return RANKS[x]+RANKS[x];return x>y?RANKS[x]+RANKS[y]+'s':RANKS[y]+RANKS[x]+'o'}
const PCT=new Float32Array(169);
function draw(u){let c;do c=Math.random()*52|0;while(u[c]);u[c]=1;return c}
function buildPCT(){
  const rows=[];
  for(let i=0;i<169;i++){const x=Math.floor(i/13),y=i%13;let a,b,n;
    if(x===y){a=x*4;b=x*4+1;n=6}else if(x>y){a=x*4;b=y*4;n=4}else{a=y*4;b=x*4+1;n=12}
    rows.push({i,n,e:equity([a,b],[],[{range:1,agg:0}],700).eq})}
  rows.sort((p,q)=>q.e-p.e);let cum=0;
  for(const r of rows){PCT[r.i]=(cum+r.n/2)/1326;cum+=r.n}
}
const pctOf=(a,b)=>PCT[cls(a,b)];

/* ---------- Monte Carlo equity with opponent ranges ---------- */
const U=new Uint8Array(52);
function sample(o,board,out){
  const n=board.length>=3?1+Math.min(o.agg,3):1;let best=-1,b0=-1,b1=-1;
  for(let k=0;k<n;k++){let a,b,t=0;
    for(;;){a=draw(U);b=draw(U);if(o.range>=1||pctOf(a,b)<=o.range||++t>40)break;U[a]=0;U[b]=0}
    if(n===1){out[0]=a;out[1]=b;return}
    const s=ev([a,b,...board]);
    if(s>best){if(b0>=0){U[b0]=0;U[b1]=0}best=s;b0=a;b1=b}else{U[a]=0;U[b]=0}}
  out[0]=b0;out[1]=b1;
}
function equity(hc,board,opps,iters){
  let win=0,tie=0,eq=0;const oh=opps.map(()=>[0,0]),bb=new Array(5);
  for(let it=0;it<iters;it++){
    U.fill(0);for(const c of hc)U[c]=1;for(const c of board)U[c]=1;
    for(let o=0;o<opps.length;o++)sample(opps[o],board,oh[o]);
    for(let k=0;k<5;k++)bb[k]=k<board.length?board[k]:draw(U);
    const hs=ev([hc[0],hc[1],...bb]);let lost=false,ties=0;
    for(let o=0;o<opps.length;o++){const s=ev([oh[o][0],oh[o][1],...bb]);if(s>hs){lost=true;break}if(s===hs)ties++}
    if(!lost){if(ties){tie++;eq+=1/(ties+1)}else{win++;eq++}}
  }
  return {win:win/iters,tie:tie/iters,eq:eq/iters};
}

/* ---------- game state ---------- */
const BOTS=[['Viper','LAG'],['Maven','TAG'],['Ghost','TAG'],['Shark','LAG'],['Rook','TAG']];
const CAS={open:1.9,agg:.6,bluff:1.6,loose:true};const STY={TAG:{open:1,agg:1,bluff:1},LAG:{open:1.3,agg:1.25,bluff:1.5}};
const POS=['BTN','SB','BB','UTG','MP','CO'];
const P=[{name:'You',hero:true,stack:START}].concat(BOTS.map(([n,s])=>({name:n,sty:s,stack:START})));
const S={dealer:Math.random()*6|0,board:[],deck:[],street:0,cur:0,minR:BB,toAct:0,hand:0,raises:0,over:true,log:[],reveal:false,heroTurn:false,banner:''};
const ST={hands:0,net:0,dec:0,leak:0,won:0};
let opt={spd:800,auto:true,peek:false,c4:true,lvl:'casual',hints:true};
try{Object.assign(opt,JSON.parse(localStorage.getItem('txp-opt')||'{}'))}catch(e){}
const posName=i=>POS[(i-S.dealer+6)%6];
const potSize=()=>P.reduce((s,p)=>s+p.total,0);
const minTo=()=>S.cur===0?BB:S.cur+S.minR;
function rangeOf(p){if(p.pfLevel>=3)return .03;if(p.pfLevel===2)return .07;if(p.pfLevel===1)return({UTG:.15,MP:.19,CO:.28,BTN:.42,SB:.34,BB:.2})[p.pos]||.2;if(p.pfC)return .4;return 1}
const L=(t,k='')=>S.log.push({t,k});
const ct=c=>`<span class="lc c${st(c)}">${rl(rk(c))}${SYM[st(c)]}</span>`;
let timer=null,nextT=null;

function startHand(){
  clearTimeout(nextT);
  if(P[0].stack<=0){S.over=true;S.banner='You are out of chips — rebuy to continue.';render();return}
  S.prevLog=S.log;S.log=[];
  for(const p of P)if(!p.hero&&p.stack<BB*25){p.stack=START;L(`${p.name} reloads to ${START}`)}
  S.hand++;S.dealer=(S.dealer+1)%6;S.board=[];S.street=0;S.raises=0;S.over=false;S.reveal=false;S.banner='';
  const d=[...Array(52).keys()];for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}S.deck=d;
  S.heroStart=P[0].stack;S.dealtAt=Date.now();S.shownBoard=0;
  P.forEach((p,i)=>Object.assign(p,{cards:[d.pop(),d.pop()],folded:false,allIn:false,bet:0,total:0,acted:false,pfLevel:0,pfC:false,agg:0,last:'',win:false,gain:0,pos:posName(i)}));
  const sb=(S.dealer+1)%6,bb=(S.dealer+2)%6;post(sb,SB);post(bb,BB);
  P[sb].last='SB 1';P[bb].last='BB 2';
  S.cur=BB;S.minR=BB;S.toAct=(bb+1)%6;
  L(`Hand #${S.hand} — dealer ${P[S.dealer].name}`,'st');L(`Your cards: ${P[0].cards.map(ct).join(' ')}`);
  proceed();
}
function post(i,a){const p=P[i];a=Math.min(a,p.stack);p.stack-=a;p.bet+=a;p.total+=a;if(!p.stack)p.allIn=true}
function put(p,a){a=Math.min(a,p.stack);p.stack-=a;p.bet+=a;p.total+=a}
function roundDone(){
  const act=P.filter(p=>!p.folded&&!p.allIn),mx=Math.max(...P.filter(p=>!p.folded).map(p=>p.bet));
  if(!act.length)return true;
  if(act.length===1&&P.some(p=>!p.folded&&p.allIn))return act[0].bet>=mx;
  return act.every(p=>p.acted&&p.bet===S.cur);
}
function proceed(){
  const live=P.filter(p=>!p.folded);
  if(live.length===1)return uncontested(live[0]);
  if(roundDone()){render();return void(timer=setTimeout(nextStreet,450))}
  let i=S.toAct,g=0;while((P[i].folded||P[i].allIn)&&g++<6)i=(i+1)%6;S.toAct=i;
  if(P[i].hero){S.heroTurn=true;render()}
  else{S.heroTurn=false;render();timer=setTimeout(()=>botAct(i),opt.spd*(0.6+Math.random()*.8))}
}
function act(i,type,to){
  const p=P[i],toCall=S.cur-p.bet;let t;
  if(type==='check'&&toCall>0)type='call';
  if(type==='fold'){p.folded=true;t='folds'}
  else if(type==='check')t='checks';
  else if(type==='call'){const a=Math.min(toCall,p.stack);put(p,a);t=`calls ${a}`;if(!S.street)p.pfC=true}
  else{const mx=p.bet+p.stack;to=Math.min(Math.max(Math.round(to),minTo()),mx);
    if(to<=S.cur){const a=Math.min(toCall,p.stack);put(p,a);t=`calls ${a}`}
    else{const bet0=S.cur===0;put(p,to-p.bet);if(to-S.cur>=S.minR)S.minR=to-S.cur;S.cur=to;
      for(const q of P)if(q!==p)q.acted=false;
      if(!S.street){S.raises++;p.pfLevel=S.raises}else p.agg++;
      t=(bet0?'bets ':'raises to ')+to}}
  if(!p.stack&&type!=='fold'){p.allIn=true;t+=' (all-in)'}
  p.acted=true;p.last=t;L(`${p.name} ${t}`);
  S.toAct=(i+1)%6;proceed();
}
function nextStreet(){
  for(const p of P){p.bet=0;p.acted=false;if(!p.folded&&!p.allIn)p.last=''}
  S.cur=0;S.minR=BB;
  if(S.street===3)return showdown();
  S.street++;
  if(S.street===1)S.board.push(S.deck.pop(),S.deck.pop(),S.deck.pop());else S.board.push(S.deck.pop());
  L(`${['','Flop','Turn','River'][S.street]}: ${S.board.map(ct).join(' ')} (pot ${potSize()})`,'st');
  S.toAct=(S.dealer+1)%6;
  if(P.filter(p=>!p.folded&&!p.allIn).length<=1){S.reveal=true;S.heroTurn=false;render();return void(timer=setTimeout(nextStreet,1200))}
  proceed();
}
function uncontested(p){const pot=potSize();p.stack+=pot;p.win=true;p.gain=pot;for(const q of P)q.bet=0;L(`${p.name} wins ${pot} (no showdown)`,'w');S.banner=`${p.name} ${p.hero?'win':'wins'} ${pot}`;endHand()}
function showdown(){
  S.reveal=true;const live=P.filter(p=>!p.folded);
  for(const p of live){p.score=ev([...p.cards,...S.board]);L(`${p.name} shows ${p.cards.map(ct).join(' ')} — ${hname(p.score)}`)}
  const lv=[...new Set(P.filter(p=>p.total>0).map(p=>p.total))].sort((a,b)=>a-b);let prev=0;const got=new Map();
  for(const lvl of lv){let amt=0;for(const p of P)amt+=Math.max(0,Math.min(p.total,lvl)-prev);
    let el=live.filter(p=>p.total>=lvl);if(!el.length)el=live;prev=lvl;if(!amt)continue;
    const best=Math.max(...el.map(p=>p.score)),w=el.filter(p=>p.score===best),sh=Math.floor(amt/w.length);let rem=amt-sh*w.length;
    for(const p of w){const g=sh+(rem-->0?1:0);p.stack+=g;got.set(p,(got.get(p)||0)+g)}}
  const msgs=[];for(const [p,g] of got){p.gain=g;const net=g-p.total;p.win=true;if(net>0||got.size===1){msgs.push(`${p.name} wins ${g} with ${hname(p.score)}`);L(`${p.name} wins ${g} — ${hname(p.score)}`,'w')}}
  {const ws=[...got.keys()].filter(p=>p.gain>p.total||got.size===1),tot=[...got.values()].reduce((a,b)=>a+b,0),nm=ws.map(p=>p.name);S.banner=(nm.length>1?nm.join(' & ')+' split '+tot:nm[0]+(nm[0]==='You'?' win ':' wins ')+tot)+' · '+hname(ws[0].score)}endHand();
}
function endHand(){
  S.over=true;S.heroTurn=false;ST.hands++;const d=P[0].stack-S.heroStart;ST.net+=d;if(d>0)ST.won++;
  render();if(opt.auto&&P[0].stack>0)nextT=setTimeout(startHand,3600);
}

/* ---------- bot brain ---------- */
function isIP(i){const o=j=>(j-S.dealer-1+12)%6,m=o(i);return P.every((q,j)=>j===i||q.folded||o(j)<m)}
function botAct(i){
  if(S.over)return;const p=P[i],sty=opt.lvl==='casual'?CAS:STY[p.sty],toCall=S.cur-p.bet,pot=potSize(),r=Math.random();
  const d=S.street?postflop(i,p,sty,toCall,pot,r):preflop(i,p,sty,toCall,r);act(i,d[0],d[1]);
}
function preflop(i,p,sty,toCall,r){
  const pct=pctOf(p.cards[0],p.cards[1]),pos=posName(i),eff=p.bet+p.stack,cf=toCall/eff,fold=toCall?['fold']:['check'];
  if(!S.raises){
    const limp=P.filter(q=>!q.folded&&q.pfC).length;
    const th={UTG:.14,MP:.19,CO:.27,BTN:.44,SB:.36,BB:.14}[pos]*sty.open-limp*.02;
    if(pct<th)return['raise',BB*(pos==='SB'?3:2.5)+limp*BB];
    if(!toCall)return['check'];
    if(pos==='SB'&&limp&&pct<.4)return['call'];
    return fold;
  }
  if(S.raises===1){
    const ip=pos==='BTN'||pos==='CO';
    let callTh=pos==='BB'?(toCall<=BB*2.5?.42:toCall<=BB*4?.3:.17):ip?.18:pos==='SB'?.08:.12;
    if(cf>.35)callTh=.05;
    if(pct<.045*sty.agg||(pct>.13&&pct<.24&&r<.1*sty.bluff&&cf<.15)){const to=Math.round(S.cur*(ip?3:3.8));return['raise',to>eff*.45?eff:to]}
    return pct<callTh*(sty.loose?2.4:1)?['call']:fold;
  }
  if(pct<.022||(S.raises===2&&pct<.03)){const to=Math.round(S.cur*2.3);return['raise',to>eff*.4?eff:to]}
  if(pct<.06&&cf<.4||pct<.035)return['call'];
  return fold;
}
function postflop(i,p,sty,toCall,pot,r){
  const opps=P.filter(q=>q!==p&&!q.folded).map(q=>({range:rangeOf(q),agg:q.agg})),n=opps.length;
  const e=equity(p.cards,S.board,opps,450).eq,ip=isIP(i),po=toCall/(pot+toCall),eff=p.bet+p.stack;
  const betTo=f=>{let a=Math.max(BB,Math.round(pot*f));if(a>p.stack*.7)a=p.stack;return p.bet+a};
  const raiseTo=()=>{let t=S.cur+Math.round((pot+toCall)*.8);if(t>eff*.6)t=eff;return t};
  const strong=n===1?.72:.58,good=n===1?.55:.4,drawy=S.street<3&&e>.28&&e<.5;
  if(!toCall){
    if(e>strong)return r<.82?['raise',betTo(.6+r*.15)]:['check'];
    if(e>good)return r<.55*sty.agg?['raise',betTo(.5)]:['check'];
    if(drawy&&r<.35*sty.agg)return['raise',betTo(.6)];
    if(n===1&&r<(ip?.26:.12)*sty.bluff)return['raise',betTo(S.street===3?.75:.5)];
    return['check'];
  }
  const imp=S.street===1?.04:S.street===2?.02:0;
  if(e>Math.max(.8,strong+.08))return r<.6*sty.agg?['raise',raiseTo()]:['call'];
  if(e>strong&&r<.25*sty.agg)return['raise',raiseTo()];
  if(e+imp+(sty.loose?.12:0)>po+.02)return['call'];
  if(drawy&&n===1&&r<.08*sty.bluff&&p.stack>toCall*3)return['raise',raiseTo()];
  return['fold'];
}


/* ---------- coach (summarised helper) ---------- */
let HK='',HC=null;
function outs(){
  const h=P[0].cards,b=S.board,cur=ev([...h,...b])>>20,g={};let n=0;
  for(let c=0;c<52;c++){if(h.includes(c)||b.includes(c))continue;const nc=ev([...h,...b,c])>>20,bc=ev([...b,c])>>20;if(nc>cur&&nc>bc){(g[nc]=g[nc]||[]).push(c);n++}}
  return{g,n};
}
function threats(){
  const h=P[0].cards,b=S.board,mine=ev([...h,...b]),un=[];for(let c=0;c<52;c++)if(!h.includes(c)&&!b.includes(c))un.push(c);
  let beat=0,tot=0;const g={};
  for(let i=0;i<un.length;i++)for(let j=i+1;j<un.length;j++){tot++;const s=ev([un[i],un[j],...b]);
    if(s>mine){beat++;const c=s>>20,k=clsName(cls(un[i],un[j]));(g[c]=g[c]||{n:0,k:{}}).n++;g[c].k[k]=(g[c].k[k]||0)+1}}
  return{beat,tot,g};
}
function preInfo(){
  const h=P[0].cards,cnt=Array(13).fill(4);for(const c of h)cnt[rk(c)]--;
  const n=P.slice(1).filter(p=>!p.folded).length,cmb=r=>cnt[r]*(cnt[r]-1)/2;let all=0,hi=0;
  const hp=rk(h[0])===rk(h[1])?rk(h[0]):-1;
  for(let r=0;r<13;r++){all+=cmb(r);if(hp>=0&&r>hp)hi+=cmb(r)}
  const atl=x=>1-Math.pow(1-x/1225,n);
  return{anyPair:atl(all),higher:hp>=0?atl(hi):null,hp};
}
function computeHelper(){
  const h=P[0],opp=P.slice(1).filter(p=>!p.folded);
  return{rnd:equity(h.cards,S.board,opp.map(()=>({range:1,agg:0})),2500),
    rng:equity(h.cards,S.board,opp.map(q=>({range:rangeOf(q),agg:q.agg})),2000),
    outs:S.street&&S.street<3?outs():null,thr:S.street?threats():null,pre:S.street?null:preInfo(),n:opp.length};
}
function advice(){
  const h=P[0],toCall=S.cur-h.bet,pot=potSize(),e=HC.rng.eq,need=toCall>0?toCall/(pot+toCall):0;
  if(toCall<=0){
    if(e>.62)return{a:'raise',t:'Bet for value',c:'v-good',why:'You are probably ahead — make them pay.'};
    if(e>.45)return{a:'raise',t:'Small bet or check',c:'v-mid',why:'Decent hand; a small bet keeps worse hands in.'};
    return{a:'call',t:'Check',c:'v-mid',why:'Weak right now — see a free card.'};
  }
  if(e>Math.max(.65,need+.25))return{a:'raise',t:'Raise',c:'v-good',why:`You win ${pc(e)}, only need ${pc(need)}.`};
  if(e>=need)return{a:'call',t:'Call',c:'v-good',why:`You win ${pc(e)} — more than the ${pc(need)} you need.`};
  if(e>=need-.05)return{a:'call',t:'Close — call or fold',c:'v-mid',why:`You win ${pc(e)}, need ${pc(need)}. Break-even.`};
  return{a:'fold',t:'Fold',c:'v-bad',why:`You win ${pc(e)} but need ${pc(need)} to call.`};
}
function renderCoach(){
  const h=P[0],el=$('#coach');
  if(!h.cards||!h.cards.length){el.innerHTML='<div class="sub">Getting the table ready…</div>';return}
  if(h.folded){el.innerHTML=`<div class="ring" style="--p:0"><div><b>–</b><small>OUT</small></div></div><div><div class="say">You folded ${h.cards.map(ct).join('')}</div><div class="sub">Watch how it plays out. Turn on study mode in Settings to see the bots' cards.</div></div>`;return}
  const k=[S.hand,S.street,P.filter(p=>!p.folded).length,P.reduce((s,p)=>s+p.agg+p.pfLevel,0)].join('|');
  if(k!==HK){HK=k;HC=computeHelper()}
  const c=HC,toCall=S.cur-h.bet,pot=potSize(),e=c.rng.eq,rc=e>.55?'var(--green)':e>.3?'var(--gold)':'var(--red)';
  const name=S.street?hname(ev([...h.cards,...S.board])):`${clsName(cls(h.cards[0],h.cards[1]))} — top ${Math.max(1,Math.round(pctOf(h.cards[0],h.cards[1])*100))}% of starting hands`;
  let sub=[];
  if(c.outs&&c.outs.n){const u=50-S.board.length,n=c.outs.n,p=S.street===1?1-((u-n)*(u-n-1))/(u*(u-1)):n/u;sub.push(`<b>${n} outs</b> to improve · ${pc(p)} ${S.street===1?'by the river':'on the river'}`)}
  if(c.thr){const top=Object.keys(c.thr.g).sort((a,b)=>c.thr.g[b].n-c.thr.g[a].n).slice(0,2).map(x=>CATS[x]);sub.push(c.thr.beat?`<b>${pc(c.thr.beat/c.thr.tot)}</b> of hands beat you (mostly ${top.join(', ')})`:'<b>You have the nuts!</b>')}
  if(c.pre)sub.push(c.pre.higher!=null?`Chance someone has a bigger pair: <b>${pc(c.pre.higher)}</b>`:`Chance someone holds a pocket pair: <b>${pc(c.pre.anyPair)}</b>`);
  const my=S.heroTurn&&!S.over,ad=my?advice():null;
  let o=`<div class="ring" style="--p:${Math.round(e*100)};--rc:${rc}"><div><div><b>${pc(e)}</b><small>TO WIN</small></div></div></div>`;
  o+=`<div><div class="say">${name}</div><div class="sub">${my&&toCall>0?`Call <b>${Math.min(toCall,h.stack)}</b> to win <b>${pot}</b> · need <b>${pc(toCall/(pot+toCall))}</b> · `:''}${sub.join(' · ')}</div></div>`;
  o+=ad&&opt.hints?`<div class="verdict ${ad.c}" title="${ad.why}">${ad.t}</div>`:'<div></div>';
  o+=`<details class="more" ${S.more?'open':''}><summary>More details</summary><div class="grid">${moreHTML(c)}</div></details>`;
  el.innerHTML=o;
  el.querySelector('.more').ontoggle=e=>{S.more=e.target.open};
  ['bFold','bCall','bRaise'].forEach(id=>$('#'+id).classList.remove('rec'));
  if(ad&&opt.hints)$({fold:'#bFold',call:'#bCall',raise:'#bRaise'}[ad.a]).classList.add('rec');
}
function moreHTML(c){
  let o=`<div>Win chance vs <b>random hands</b>: ${pc(c.rnd.eq)} · vs <b>their likely hands</b> (based on how they bet): ${pc(c.rng.eq)} · ${c.n} opponent${c.n>1?'s':''} left</div>`;
  if(c.outs&&c.outs.n)for(const cat of Object.keys(c.outs.g).sort((a,b)=>b-a))o+=`<div class="cat"><b>Outs → ${CAT[cat]}:</b>${c.outs.g[cat].map(ct).join('')}</div>`;
  if(c.thr&&c.thr.beat)for(const cat of Object.keys(c.thr.g).sort((a,b)=>b-a)){const ks=Object.entries(c.thr.g[cat].k).sort((a,b)=>b[1]-a[1]);
    o+=`<div class="cat"><b>${CAT[cat]} beats you (${c.thr.g[cat].n} combos):</b>${ks.slice(0,8).map(([k])=>`<span class="pill">${k}</span>`).join('')}${ks.length>8?`<span class="pill">+${ks.length-8}</span>`:''}</div>`}
  return o;
}
function coachLog(type){
  const h=P[0],toCall=S.cur-h.bet;if(toCall<=0||!HC)return;
  const pot=potSize(),need=toCall/(pot+toCall),e=HC.rng.eq;let g=true;
  if(type==='fold')g=e<need+.08;else if(type==='call')g=e>=need-.05;
  ST.dec++;if(!g){ST.leak++;L(`Coach: ${type==='fold'?`folded with ${pc(e)} (needed ${pc(need)})`:`called with ${pc(e)} (needed ${pc(need)})`} — leak`,'st')}
}
function heroAct(type){
  if(!S.heroTurn)return;const to=+$('#rIn').value;coachLog(type);S.heroTurn=false;S.rOpen=false;act(0,type,to);
}

/* ---------- rendering ---------- */
const COL=['#7c5cff','#e0364a','#1f9d55','#f08c1a','#2f72e6','#c2399e'];
function card(c,cl=''){return`<div class="cd c${st(c)} ${cl}"><b>${rl(rk(c))}</b><i>${SYM[st(c)]}</i></div>`}
function render(){
  document.body.classList.toggle('classic',!opt.c4);
  const fresh=Date.now()-(S.dealtAt||0)<500;
  $('#seats').innerHTML=P.map((p,i)=>{
    const has=p.cards&&p.cards.length,show=has&&(p.hero||opt.peek||(S.reveal&&!p.folded));
    const cs=has&&!(p.folded&&!p.hero&&!opt.peek)?p.cards.map((c,k)=>{const h=show?card(c,p.win&&S.over&&S.reveal?'hi':''):'<div class="cd back"></div>';return fresh?h.replace('class="cd','style="animation-delay:'+(i*60+k*30)+'ms" class="deal cd'):h}).join(''):'';
    const turn=S.toAct===i&&!S.over&&(S.heroTurn||!p.hero);
    const a=p.last||'',ac=/fold/.test(a)?'fold':/raise|bet|all-in/.test(a)?'raise':/call|check/.test(a)?'call':'';
    return`<div class="seat s${i} ${p.folded?'out':''} ${turn?'turn':''} ${p.win&&S.over?'win':''}">${p.win&&S.over&&p.gain?`<div class="gain">+${p.gain}</div>`:''}<div class="hand">${cs}</div><div class="plate">${S.dealer===i?'<span class="btn-d">D</span>':''}${p.pos?`<span class="tag">${p.pos}</span>`:''}<div class="av" style="--c:${COL[i]}">${p.name[0]}</div><div class="who"><div class="nm">${p.name}</div><div class="stk">${p.stack}</div></div>${a?`<span class="act ${ac}">${a}</span>`:''}</div></div>`}).join('');
  $('#bets').innerHTML=P.map((p,i)=>p.bet?`<div class="bet b${i}">${p.bet}</div>`:'').join('');
  const nb=S.board.length,old=S.shownBoard||0;
  $('#board').innerHTML=[0,1,2,3,4].map(k=>k<nb?(k>=old?card(S.board[k]).replace('class="cd','style="animation-delay:'+(k-old)*90+'ms" class="deal cd'):card(S.board[k])):'<div class="slot"></div>').join('');S.shownBoard=nb;
  $('#pot').innerHTML=`Pot ${potSize()}<small>blinds 1/2</small>`;
  $('#banner').innerHTML=S.banner?`<div class="banner">${S.banner}</div>`:'';
  renderControls();renderCoach();
  const lg=$('#log');lg.innerHTML=S.log.map(e=>`<div class="${e.k}">${e.t}</div>`).join('');lg.scrollTop=1e6;
  const bb100=ST.hands?(ST.net/BB)/ST.hands*100:0;
  $('#stats').innerHTML=`<span>Hands <b>${ST.hands}</b></span><span>Profit <b style="color:${ST.net>=0?'var(--green)':'var(--red)'}">${ST.net>=0?'+':''}${ST.net}</b></span><span>bb/100 <b>${bb100.toFixed(0)}</b></span><span>Leaks <b>${ST.leak}</b>/${ST.dec}</span>`;
}
function renderControls(){
  const h=P[0],my=S.heroTurn&&!S.over,toCall=S.cur-h.bet,mx=h.bet+h.stack,mn=Math.min(minTo(),mx),pot=potSize();
  const bF=$('#bFold'),bC=$('#bCall'),bR=$('#bRaise'),bN=$('#bNext');
  [bF,bC,bR].forEach(b=>{b.hidden=S.over;b.disabled=!my});
  bF.disabled=!my||toCall<=0;bR.disabled=!my||mx<=S.cur;
  bC.innerHTML=toCall>0?`Call ${Math.min(toCall,h.stack)}${toCall>=h.stack?'<small>all-in</small>':''}<kbd>C</kbd>`:'Check<kbd>C</kbd>';
  bR.innerHTML=(S.cur===0?'Bet':'Raise')+'<kbd>R</kbd>';
  bN.hidden=!S.over;bN.innerHTML=h.stack<=0?'Rebuy 200 &amp; deal':'Deal next hand<kbd>N</kbd>';
  if(!my)S.rOpen=false;
  $('#rp').classList.toggle('on',!!S.rOpen&&my);
  const sl=$('#rSl'),inp=$('#rIn'),key=S.hand+'|'+S.street+'|'+S.cur;
  if(my&&sl.dataset.k!==key){sl.dataset.k=key;sl.min=inp.min=mn;sl.max=inp.max=mx;sl.value=inp.value=mn;
    const ps=S.cur===0?[['⅓ pot',pot/3],['½ pot',pot/2],['¾ pot',pot*.75],['Pot',pot]]:!S.street&&S.raises===0?[['2.5 BB',5],['3 BB',6],['4 BB',8]]:[['2.5×',S.cur*2.5],['3×',S.cur*3],['Pot',S.cur+pot+toCall]];
    $('#pre').innerHTML=ps.map(([l,v])=>`<button data-v="${Math.round(S.cur===0?h.bet+v:v)}">${l}</button>`).join('')+`<button data-v="${mx}">All-in</button>`;
    setR(mn)}
}
function setR(v){const h=P[0],mx=h.bet+h.stack,mn=Math.min(minTo(),mx);v=Math.max(mn,Math.min(mx,Math.round(v)||mn));$('#rSl').value=$('#rIn').value=v;$('#rGo').textContent=(S.cur===0?'Bet ':'Raise to ')+v}
function save(){try{localStorage.setItem('txp-opt',JSON.stringify(opt))}catch(e){}}

$('#bFold').onclick=()=>heroAct('fold');
$('#bCall').onclick=()=>heroAct(S.cur-P[0].bet>0?'call':'check');
$('#bRaise').onclick=()=>{S.rOpen=!S.rOpen;renderControls()};
$('#rGo').onclick=()=>heroAct('raise');
$('#bNext').onclick=()=>{if(P[0].stack<=0){P[0].stack=START;L('You rebuy for 200')}startHand()};
$('#rSl').oninput=e=>setR(+e.target.value);
$('#rIn').onchange=e=>setR(+e.target.value);
$('#pre').onclick=e=>{const b=e.target.closest('button');if(b)setR(+b.dataset.v)};
const bind=(id,k,f)=>{const el=$('#'+id);if(el.type==='checkbox'){el.checked=opt[k];el.onchange=()=>{opt[k]=el.checked;save();f&&f();render()}}else{el.value=opt[k];el.onchange=()=>{opt[k]=el.type==='select-one'&&!isNaN(+el.value)?+el.value:el.value;save();render()}}};
bind('oLvl','lvl');bind('oSpd','spd');bind('oHint','hints');bind('oAuto','auto',()=>{if(!opt.auto)clearTimeout(nextT)});bind('oPeek','peek');bind('o4c','c4');
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='number'){if(e.key==='Enter')heroAct('raise');return}const k=e.key.toLowerCase();
  if(k==='f'&&!$('#bFold').disabled)heroAct('fold');else if(k==='c'&&!$('#bCall').disabled)$('#bCall').click();else if(k==='r'&&!$('#bRaise').disabled)$('#bRaise').click();else if(k==='enter'&&S.rOpen)heroAct('raise');else if(k==='n'&&S.over)$('#bNext').click()});

render();
setTimeout(()=>{buildPCT();startHand()},30);
}
</script>
</body>
</html>
